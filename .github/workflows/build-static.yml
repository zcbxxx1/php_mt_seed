name: build-static-binaries

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            musl-tools

      - name: Create output directory
        run: mkdir -p dist

      - name: Build static Linux x86_64 binary
        run: |
          musl-gcc \
            -O2 -pipe -fomit-frame-pointer -funroll-loops -static \
            php_mt_seed.c \
            -o dist/php_mt_seed-linux-x86_64
          strip dist/php_mt_seed-linux-x86_64
          ls -l dist/php_mt_seed-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_mt_seed-linux-x86_64
          path: dist/php_mt_seed-linux-x86_64
          if-no-files-found: error

  build-windows:
    name: build-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Create output directory
        shell: msys2 {0}
        run: mkdir -p dist

      - name: Build static Windows x86_64 binary
        shell: msys2 {0}
        run: |
          gcc \
            -O2 -pipe -fomit-frame-pointer -funroll-loops \
            -static -static-libgcc \
            php_mt_seed.c \
            -o dist/php_mt_seed-win-x86_64.exe
          strip dist/php_mt_seed-win-x86_64.exe
          ls -l dist/php_mt_seed-win-x86_64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_mt_seed-win-x86_64
          path: dist/php_mt_seed-win-x86_64.exe
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: php_mt_seed-*
          merge-multiple: true
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
